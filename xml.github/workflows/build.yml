        mv gerant-prod-android-project/* .
        mv gerant-prod-android-project/.* . 2>/dev/null || true
        rm -rf gerant-prod-android-project gerant-prod-android-project.zip

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gérant Prod APK
        path: app/build/outputs/apk/debugLogo Gemini Notebook
