Ces images illustrent le processus de création et de gestion de projets numérique à travers diverses plateformes en ligne. Une partie des captures d'écran détaille l'utilisation de NotebookLM de Google, montrant des outils d'intelligence artificielle pour générer des résumés, des quiz et des fiches de révision à partir de sources documentaires. En parallèle, d'autres visuels présentent l'interface de GitHub, documentant les étapes pour configurer un nouveau dépôt nommé "G-rant-Prod" destiné à une application de gestion financière. On y observe également des erreurs de navigation 404 et la structure finale d'un répertoire contenant des fichiers de code Kotlin. L'ensemble constitue un aperçu technique de l'organisation de ressources de développement et d'apprentissage sur mobile.

