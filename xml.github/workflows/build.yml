Maintenant, nous allons créer un petit fichier d'instruction pour dire aux serveurs de GitHub de décompresser votre ZIP et d'en faire une application Android installable.
Toujours sur le site de GitHub (en version ordinateur), cliquez sur le bouton "Add file" puis "Create new file" (Créer un nouveau fichier).
Dans la case pour donner un nom au fichier, écrivez exactement ceci : xml .github/workflows/build.yml  (Attention à bien mettre les points / pour que GitHub crée automatiquement les dossiers).
